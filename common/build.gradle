// MC 26+ is unobfuscated — Fabric Loom provides Minecraft on the classpath
// and processes mixins without remapping.
loom {
    // No remapping needed for unobfuscated 26.x
}

// Version-specific source sets. Minecraft 26.2 and 26.3 each introduced breaking API
// changes, so the matching compat implementation of each seam is compiled in based on
// the target version:
// - net.sortcraft.compat.HighlightCompat: 26.1.x vs 26.2+
// - net.sortcraft.compat.SignCompat: pre-26.3 vs 26.3+
sourceSets {
    main {
        java {
            if (rootProject.ext.isVersion26_2OrLater) {
                srcDir 'src/main/java-26.2'
            } else {
                srcDir 'src/main/java-26.1'
            }
            if (rootProject.ext.isVersion26_3OrLater) {
                srcDir 'src/main/java-26.3'
            } else {
                srcDir 'src/main/java-pre26.3'
            }
        }
    }
}

dependencies {
    // SnakeYAML for config parsing
    implementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    // Mixin annotations for compile-time only (provided at runtime by the mod loader)
    compileOnly "net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7"
}

