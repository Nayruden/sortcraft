plugins {
    id 'com.gradleup.shadow'
}

// Configure NeoForge via ModDevGradle
neoForge {
    version = rootProject.neoforge_version
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common

    // For shadowing SnakeYAML
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common')

    // Shadow SnakeYAML into the mod jar
    shadowBundle "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    // NeoForge dev runs execute from source outputs, not the shaded jar.
    // Put SnakeYAML on the runtime classpath for dev runs.
    runtimeOnly "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_version': project.version, // Use full version with MC version suffix
            'mod_author': rootProject.mod_author,
            'mod_description': rootProject.mod_description,
            'minecraft_version': rootProject.minecraft_version,
            'supported_minecraft_versions': rootProject.neoforge_minecraft_version,
            'neoforge_version': rootProject.neoforge_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // Shadow JAR is the final artifact — no remapping needed for unobfuscated 26+
    archiveClassifier = ''
    // Relocate SnakeYAML to a private namespace to prevent JPMS split-package
    // conflicts when another mod (or Sinytra Connector) also loads the library
    // as a named module exporting org.yaml.snakeyaml.
    relocate 'org.yaml', 'net.sortcraft.shadow.org.yaml'
}

// The non-shadowed jar gets a classifier to avoid conflict
jar {
    archiveClassifier = 'slim'
}
tasks.assemble.dependsOn tasks.shadowJar

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// ========== GameTest Configuration ==========
def enableThirdPartyGametestMods =
        project.findProperty('enableThirdPartyGametestMods')?.toString()?.toBoolean() ?: false

sourceSets {
    gametest {
        java {
            srcDir 'src/gametest/java'
            srcDir project(':common').file('src/gametest/java')
        }
        resources {
            srcDir 'src/gametest/resources'
        }
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileClasspath.extendsFrom common
    gametestRuntimeClasspath.extendsFrom common
}

dependencies {
    // Common module
    gametestImplementation project(path: ':common')

    // Sophisticated Storage + Core for integration tests.
    // JARs live in third-party/ (.gitignored) and must match the target MC version
    // because NeoForge removes/renames classes between 26.1.x patches.
    // Filenames vary across releases; match by exact MC version segment.
    def thirdParty = rootProject.file('third-party')
    def targetVer = rootProject.minecraft_version
    def ssCoreJar = null
    def ssJar = null
    if (thirdParty.isDirectory()) {
        def quoted = java.util.regex.Pattern.quote(targetVer)
        thirdParty.eachFileMatch(~/sophisticatedcore-${quoted}-.*\.jar/) { ssCoreJar = it }
        thirdParty.eachFileMatch(~/.*sophisticatedstorage-${quoted}-.*\.jar/) { ssJar = it }
    }
    if (ssCoreJar != null && ssJar != null) {
        gametestRuntimeOnly files(ssCoreJar, ssJar)
        logger.lifecycle("Third-party gametest mods for MC ${targetVer}: ${ssCoreJar.name}, ${ssJar.name}")
    } else {
        logger.lifecycle("No Sophisticated Storage JARs matching MC ${targetVer} found in third-party/ — integration tests requiring them will be skipped")
    }
}

// Configure GameTest run via ModDevGradle
neoForge {
    runs {
        gameTestServer {
            type = "gameTestServer"

            systemProperty "neoforge.enableGameTest", "true"
            systemProperty "sortcraft.gametest.enableThirdParty", String.valueOf(enableThirdPartyGametestMods)
            // Avoid collisions with local dev servers using the default 25565 port.
            programArguments.addAll "--port", "0"
            gameDirectory = project.file("run/gametest")

            sourceSet = sourceSets.gametest
        }
    }

    mods {
        sortcraft {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        sortcraft_gametest {
            sourceSet sourceSets.gametest
        }
    }
}

// Process resources for gametest source set (expand neoforge.mods.toml placeholders)
processGametestResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            'mod_version': project.version,
            'minecraft_version': rootProject.minecraft_version,
            'supported_minecraft_versions': rootProject.neoforge_minecraft_version,
            'neoforge_version': rootProject.neoforge_version
        )
    }
}
