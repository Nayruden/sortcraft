plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}" apply false
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}" apply false
    id 'com.gradleup.shadow' version '8.3.10' apply false
}

// Load version-specific properties from versions/26.1
def versionPropsFile = file("versions/26.1/gradle.properties")
if (!versionPropsFile.exists()) {
    throw new GradleException("Version properties file not found: ${versionPropsFile}")
}

def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }
versionProps.each { key, value ->
    ext.set(key, value)
}

ext.targetMcVersion = '26.1'
ext.javaVersion = 25
ext.gametestSupported = true

println "Building for Minecraft 26.1"

allprojects {
    group = rootProject.mod_group
    // Include Minecraft version in mod version for multi-version builds
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
}

// Configure common and fabric modules with Fabric Loom
configure([project(':common'), project(':fabric')]) {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }

    // MC 26+ is unobfuscated — no mappings or remap needed
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.javaVersion)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = rootProject.ext.javaVersion
    }
}

// Configure NeoForge module with ModDevGradle
configure(project(':neoforge')) {
    apply plugin: 'net.neoforged.moddev'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.javaVersion)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = rootProject.ext.javaVersion
    }
}

// Task to collect all built JARs into a single directory
tasks.register('buildAndCollect') {
    group = 'build'
    description = 'Builds all loaders and collects JARs to build/libs'

    dependsOn ':fabric:build', ':neoforge:build'

    doLast {
        def collectDir = file("${rootProject.layout.buildDirectory.get().asFile}/libs")
        collectDir.mkdirs()

        // Copy Fabric JAR
        copy {
            from "${project(':fabric').layout.buildDirectory.get().asFile}/libs"
            into collectDir
            include "*-${rootProject.mod_version}+${rootProject.minecraft_version}.jar"
            exclude "*-sources.jar", "*-dev.jar", "*-shadow.jar"
        }

        // Copy NeoForge JAR
        copy {
            from "${project(':neoforge').layout.buildDirectory.get().asFile}/libs"
            into collectDir
            include "*-${rootProject.mod_version}+${rootProject.minecraft_version}.jar"
            exclude "*-sources.jar", "*-dev.jar", "*-shadow.jar"
        }
    }
}

// Task to run GameTests on all supported loaders
tasks.register('runGameTests') {
    group = 'verification'
    description = 'Runs GameTests on all supported loaders'

    dependsOn ':fabric:runGameTest', ':neoforge:runGameTestServer'
}
