name: Build

on: [push, pull_request]

jobs:
  build:
    name: MC ${{ matrix.mc_version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc_version: ["1.21.1", "1.21.4", "1.21.5", "1.21.6", "1.21.8", "1.21.10", "1.21.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -Pmc_version=${{ matrix.mc_version }}

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.mc_version }}
          path: |
            fabric/build/reports/tests/
            common/build/reports/tests/
          if-no-files-found: ignore

      - name: Collect JARs
        run: |
          mkdir -p build/libs/all-versions
          for dir in fabric/build/libs neoforge/build/libs; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -type f -name "*+${{ matrix.mc_version }}.jar" \
                ! -name "*-sources*" ! -name "*-dev*" -exec cp {} build/libs/all-versions/ \;
            fi
          done

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: sortcraft-${{ matrix.mc_version }}
          path: build/libs/all-versions/*.jar
          if-no-files-found: error
