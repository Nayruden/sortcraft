name: Build

on: [push, pull_request]

jobs:
  # Read supported versions from versions.json so the matrix is always in sync
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          echo "matrix=$(jq -c '{mc_version: .supported}' versions.json)" >> "$GITHUB_OUTPUT"

  build:
    name: MC ${{ matrix.mc_version }}
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build -Pmc_version=${{ matrix.mc_version }}

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.mc_version }}
          path: |
            fabric/build/reports/tests/
            common/build/reports/tests/
          if-no-files-found: ignore

      - name: Collect JARs
        run: |
          mkdir -p build/libs/all-versions
          for dir in fabric/build/libs neoforge/build/libs; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -type f -name "*+${{ matrix.mc_version }}.jar" \
                ! -name "*-sources*" ! -name "*-dev*" ! -name "*-shadow*" \
                -exec cp {} build/libs/all-versions/ \;
            fi
          done

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: sortcraft-${{ matrix.mc_version }}
          path: build/libs/all-versions/*.jar
          if-no-files-found: error

  # Merge all per-version artifacts into a single download
  collect:
    name: Collect all JARs
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-jars
          pattern: sortcraft-*
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: sortcraft-all-versions
          path: all-jars/*.jar
          if-no-files-found: error
