plugins {
    id 'com.gradleup.shadow'
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    // Test classpath needs access to common module
    testCompileClasspath.extendsFrom common
    testRuntimeClasspath.extendsFrom common

    // For shadowing SnakeYAML
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // MC 26+ uses non-remap Loom — use plain implementation
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Common module (non-remap, default project configuration)
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common')

    // Shadow SnakeYAML into the mod jar
    shadowBundle "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"

    // Test dependencies - Fabric Loader JUnit for bootstrap tests
    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.fabric_loader_version}"
    // SnakeYAML for category loading tests
    testImplementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
}

// Configure test task to use JUnit Platform
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = false
        exceptionFormat "short"
    }
    // MC 26.1 does not fully bind registry components during Bootstrap.bootStrap(),
    // causing unit tests that create ItemStack objects to fail with
    // "Components not bound yet". Game tests provide full coverage instead.
    enabled = false
}

// Configure Fabric game tests
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "sortcraft-gametest"
        enableGameTests = true
        enableClientGameTests = false  // Start with server-side only
        eula = true  // By setting this to true, you agree to the Minecraft EULA
    }
}

// Include shared gametest sources from common module
sourceSets.gametest.java.srcDir project(':common').file('src/gametest/java')

// Add dependencies to gametest source set
dependencies {
    // SnakeYAML (needed because common module references it)
    gametestImplementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    // Common module
    gametestImplementation project(path: ':common')

    // Storage Drawers mod for integration tests
    // JARs live in third-party/ which is .gitignored, so guard with .exists()
    // to avoid build failures in CI or fresh checkouts.
    // Compile against the JAR so tests compile, but don't load at runtime (tests will be skipped
    // unless a 26.1-compatible JAR is available)
    def fallbackJar = rootProject.file('third-party/Storage Drawers-fabric-1.21.5-16.0.2.jar')
    if (fallbackJar.exists()) {
        gametestCompileOnly files(fallbackJar)
    }
}

// Ensure gametest classpath extends from common configuration
configurations {
    gametestCompileClasspath.extendsFrom common
    gametestRuntimeClasspath.extendsFrom common
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_version': project.version, // Use full version with MC version suffix
            'mod_author': rootProject.mod_author,
            'mod_description': rootProject.mod_description,
            'minecraft_version': rootProject.minecraft_version,
            'supported_minecraft_versions': rootProject.fabric_minecraft_version,
            'fabric_loader_version': rootProject.fabric_loader_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // MC 26+ is unobfuscated — shadow jar IS the final artifact (no remap needed)
    archiveClassifier = ''
    // Relocate SnakeYAML to a private namespace to prevent JPMS split-package
    // conflicts when another mod (or Sinytra Connector) also loads the library
    // as a named module exporting org.yaml.snakeyaml.
    relocate 'org.yaml', 'net.sortcraft.shadow.org.yaml'
}

// Shadow jar is the final artifact — wire it into assemble
jar {
    archiveClassifier = 'slim'
}
tasks.assemble.dependsOn tasks.shadowJar

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

