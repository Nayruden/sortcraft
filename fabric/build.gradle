plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    // Test classpath needs access to common module
    testCompileClasspath.extendsFrom common
    testRuntimeClasspath.extendsFrom common

    // For shadowing SnakeYAML
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Architectury API for Fabric
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric'))

    // Shadow SnakeYAML into the mod jar
    shadowBundle "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"

    // Test dependencies - Fabric Loader JUnit for bootstrap tests
    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.fabric_loader_version}"
    // SnakeYAML for category loading tests
    testImplementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
}

// Configure test task to use JUnit Platform
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = false
        exceptionFormat "short"
    }
}

// Configure Fabric game tests for supported versions (MC >= 1.21.5)
// Version flags are centralized in root build.gradle (rootProject.ext)
if (rootProject.ext.gametestSupported) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "sortcraft-gametest"
            enableGameTests = true
            enableClientGameTests = false  // Start with server-side only
            eula = true  // By setting this to true, you agree to the Minecraft EULA
        }
    }

    // Include shared gametest sources from common module
    sourceSets.gametest.java.srcDir project(':common').file('src/gametest/java')

    // Add dependencies to gametest source set
    dependencies {
        // SnakeYAML (needed because common module references it)
        gametestImplementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
        // Common module for access to compat layer (Id, IdentifierHelper, etc.)
        gametestImplementation project(path: ':common', configuration: 'namedElements')

        // Storage Drawers mod for integration tests
        // Only load at runtime for MC versions where we have a compatible JAR.
        // JARs live in third-party/ which is .gitignored, so guard with .exists()
        // to avoid build failures in CI or fresh checkouts.
        if (rootProject.targetMcVersion in ['1.21.11']) {
            def storageDrawersFile = rootProject.file('third-party/StorageDrawers-fabric-1.21.11-20.0.0.jar')
            if (storageDrawersFile.exists()) {
                gametestCompileOnly files(storageDrawersFile)
                modLocalRuntime files(storageDrawersFile)
            }
        } else if (rootProject.targetMcVersion == '1.21.5') {
            def storageDrawersFile = rootProject.file('third-party/Storage Drawers-fabric-1.21.5-16.0.2.jar')
            if (storageDrawersFile.exists()) {
                gametestCompileOnly files(storageDrawersFile)
                modLocalRuntime files(storageDrawersFile)
            }
        } else {
            // For other gametest versions (1.21.6, 1.21.8, 1.21.10), compile against the JAR
            // so tests compile, but don't load at runtime (tests will be skipped)
            def fallbackJar = rootProject.file('third-party/Storage Drawers-fabric-1.21.5-16.0.2.jar')
            if (fallbackJar.exists()) {
                gametestCompileOnly files(fallbackJar)
            }
        }
    }

    // Ensure gametest classpath extends from common configuration for version-specific classes
    configurations {
        gametestCompileClasspath.extendsFrom common
        gametestRuntimeClasspath.extendsFrom common
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_version': project.version, // Use full version with MC version suffix
            'mod_author': rootProject.mod_author,
            'mod_description': rootProject.mod_description,
            'minecraft_version': rootProject.minecraft_version,
            'supported_minecraft_versions': rootProject.fabric_minecraft_version,
            'fabric_loader_version': rootProject.fabric_loader_version,
            'architectury_version': rootProject.architectury_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'architectury.common.json'
    // Relocate SnakeYAML to a private namespace to prevent JPMS split-package
    // conflicts when another mod (or Sinytra Connector) also loads the library
    // as a named module exporting org.yaml.snakeyaml.
    relocate 'org.yaml', 'net.sortcraft.shadow.org.yaml'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

